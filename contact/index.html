<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact | Shree Sainath Packaging</title>
  <link rel="shortcut icon" href="../assets/logo1.ico" type="image/x-icon">

  <!-- Import Rubik font from Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Rubik:400,500,700&display=swap" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* =========================
       CSS VARIABLES & BASE STYLES
    ============================ */
    :root {
      --brown: #a36600; /* Primary brown */
      --brown-dark: #7a4d00;
      --white: #fff;
      --input-bg: #e9eef6;
      --input-focus: #fff7e6;
      --input-border: #c9a76a;
      --input-border-focus: #a36600;
      --input-shadow: 0 0 0 2px #a3660033;
      --input-shadow-strong: 0 0 0 3px #a3660055;
      --text: #222;
      --placeholder: #888;
      --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.10);
      --established-hover: #ffe5b4;
      --accent-color: var(--brown-dark);
    }

    /* ===========================
       Navbar Styles
    ============================ */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0px 80px;
      background-color: var(--white);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .hamburger {
      display: none;
      cursor: pointer;
      padding: 10px;
    }

    .hamburger-line {
      width: 25px;
      height: 3px;
      background-color: var(--text);
      margin: 5px 0;
      transition: all 0.3s ease;
    }

    .nav-links {
      display: flex;
      align-items: center;
    }

    .logo img {
      height: 100px;
    }

    .nav-links a {
      margin-left: 30px;
      font-weight: 600;
      color: var(--text);
      transition: color 0.3s ease;
      text-decoration: none !important;
    }

    .nav-links a:hover {
      color: var(--accent-color);
    }

    @media (max-width: 768px) {
      .navbar {
        padding: 20px;
        position: relative;
      }

      .hamburger {
        display: block;
        z-index: 1001;
      }

      .hamburger.active .hamburger-line:nth-child(1) {
        transform: rotate(45deg) translate(5px, 5px);
      }

      .hamburger.active .hamburger-line:nth-child(2) {
        opacity: 0;
      }

      .hamburger.active .hamburger-line:nth-child(3) {
        transform: rotate(-45deg) translate(7px, -6px);
      }

      .nav-links {
        position: fixed;
        top: 0;
        right: -250px;
        width: 250px;
        height: 100vh;
        background-color: var(--white);
        flex-direction: column;
        align-items: flex-start;
        padding: 80px 30px 30px 30px;
        box-shadow: -2px 0 5px rgba(0, 0, 0, 0.1);
        transition: right 0.3s ease;
        z-index: 1000;
      }

      .nav-links.active {
        right: 0;
      }

      .nav-links a {
        margin: 15px 0;
        font-size: 1.1rem;
        width: 100%;
        padding: 10px 0;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        text-decoration: none !important;
      }

      .nav-links a:last-child {
        border-bottom: none;
      }

      .nav-links a:hover {
        color: var(--accent-color);
        padding-left: 10px;
        text-decoration: none !important;
      }
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Rubik', Arial, sans-serif;
      background: var(--brown);
      color: var(--text);
      box-sizing: border-box;
      scroll-behavior: smooth;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 60px; /* Adjust based on header height */
    }

    /* =========================
       MAIN LAYOUT
    ============================ */
    .contact-main-wrapper {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      max-width: 1400px;
      gap: 0;
      padding: 40px 20px;
      box-sizing: border-box;
      min-height: 80vh;
    }
    /* =========================
       LEFT: CONTACT INFO BLOCK
    ============================ */
    .contact-info-block {
      flex: 1 1 600px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      background: transparent;
      color: var(--white);
      font-size: 1.1rem;
      font-weight: 400;
      max-width: 600px;
      min-width: 400px;
      padding: 0 40px 0 0;
      justify-content: flex-start;
      height: 100%;
    }
    .contact-info-inner {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      margin-top: 48px;
    }
    .contact-info-block h2 {
      font-size: 1.8rem;
      font-weight: 700;
      margin: 0 0 28px 0;
      letter-spacing: 0.5px;
      color: var(--white);
      align-self: flex-start;
    }
    .contact-info-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 2.2em;
      width: 100%;
    }
    .contact-info-label {
      font-weight: 700;
      font-size: 1.1em;
      margin-bottom: 0.2em;
      margin-top: 0;
      letter-spacing: 0.01em;
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .contact-info-label i {
      font-size: 1.2em;
    }
    .contact-info-value {
      font-weight: 400;
      font-size: 1.05em;
      margin-bottom: 0;
      margin-left: 0;
      word-break: break-all;
      align-self: flex-start;
    }
    .contact-info-value a {
      color: var(--white);
      text-decoration: none;
      transition: color 0.2s;
    }
    .contact-info-value a:hover {
      color: #ffe5b4;
    }
    .contact-social-row {
      display: flex;
      justify-content: flex-start;
      width: 100%;
      gap: 32px;
      margin: 2.2em 0 0.8em 0;
    }
    .contact-social-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: transparent;
      color: var(--white);
      font-size: 1.8rem;
      transition: transform 0.18s cubic-bezier(.4,1.4,.6,1), box-shadow 0.18s, background 0.18s, color 0.18s;
      box-shadow: none;
      border: none;
      outline: none;
      cursor: pointer;
      text-decoration: none;
    }
    .contact-social-icon:hover,
    .contact-social-icon:focus {
      transform: scale(1.13) rotate(-6deg);
      background: var(--white);
      color: var(--brown);
      box-shadow: 0 4px 16px rgba(163,102,0,0.18);
    }
    .established {
      margin-top: 2em;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--white);
      letter-spacing: 0.5px;
      text-align: left;
      width: 100%;
      background: none;
      border-radius: 0;
      padding: 0;
      margin-bottom: 0;
      margin-right: 0;
      margin-left: 0;
      align-self: flex-start;
      box-sizing: border-box;
      transition: color 0.2s, background 0.2s;
    }
    .established:hover, .established:focus {
      color: #ffe5b4;
      background: #a3660022;
    }
    .brochure-link {
      margin-top: 1em;
      font-size: 1.1rem;
      color: var(--white);
      text-decoration: underline;
      text-align: left;
      width: 100%;
      transition: color 0.2s;
    }
    .brochure-link:hover, .brochure-link:focus {
      color: #ffe5b4;
    }
    /* =========================
       RIGHT: CONTACT FORM
    ============================ */
    .contact-form-card {
      flex: 1 1 800px;
      background: var(--white);
      box-shadow: var(--shadow);
      border-radius: 16px;
      padding: 24px 60px;
      max-width: 600px;
      min-width: 400px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      position: relative;
      z-index: 2;
      animation: fadeInCard 1.2s cubic-bezier(.4,1.4,.6,1) 0.3s both;
      opacity: 0;
      justify-content: center;
      min-height: 350px;
    }
    @keyframes fadeInCard {
      to { opacity: 1; }
    }
    .contact-form-card h3,
    .contact-form-card p {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--brown);
      text-align: center;
      margin-bottom: 0.2em;
      letter-spacing: 0.5px;
    }
    .contact-form-card p {
      margin-bottom: 1.5em;
      font-weight: 700;
    }
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-group label {
      font-size: 1rem;
      font-weight: 500;
      color: var(--brown-dark);
      margin-bottom: 2px;
    }
    .form-group input,
    .form-group textarea {
      font-family: inherit;
      font-size: 1rem;
      padding: 12px 16px;
      border: 2px solid var(--input-border);
      border-radius: 10px;
      background: var(--input-bg);
      color: var(--text);
      transition: box-shadow 0.2s, background 0.2s, border-color 0.2s;
      outline: none;
      resize: none;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .form-group input:hover,
    .form-group textarea:hover {
      border-color: var(--brown-dark);
      box-shadow: var(--input-shadow-strong);
      background: #fffbe9;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      background: var(--input-focus);
      box-shadow: var(--input-shadow-strong);
      border-color: var(--brown);
    }
    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: var(--placeholder);
      opacity: 1;
      font-size: 1.13rem;
    }
    .contact-form button {
      margin-top: 12px;
      padding: 12px 0;
      background: var(--brown);
      color: var(--white);
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(163,102,0,0.10);
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      letter-spacing: 0.5px;
      width: 160px;
      align-self: center;
    }
    .contact-form button:hover,
    .contact-form button:focus {
      background: var(--brown-dark);
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 4px 16px rgba(163,102,0,0.18);
    }
    /* =========================
       RESPONSIVE DESIGN
    ============================ */
    @media (max-width: 1400px) {
      .contact-info-block {
        max-width: 500px;
        min-width: 350px;
      }
      .contact-form-card {
        max-width: 700px;
        min-width: 350px;
        padding: 24px 40px;
      }
    }
    @media (max-width: 1200px) {
      .contact-main-wrapper {
        max-width: 100vw;
        padding: 32px 16px;
      }
      .contact-info-block {
        max-width: 400px;
        min-width: 300px;
        padding-right: 20px;
      }
      .contact-form-card {
        max-width: 600px;
        min-width: 300px;
        padding: 20px 32px;
      }
    }
    @media (max-width: 900px) {
      .contact-main-wrapper {
        gap: 0;
        padding: 24px 12px;
      }
      .contact-info-block {
        padding-right: 0;
      }
      .contact-form-card {
        padding: 20px 24px;
      }
    }
    @media (max-width: 768px) {
      .contact-main-wrapper {
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 16px 0;
        max-width: 100vw;
      }
      .contact-info-block, .contact-form-card {
        max-width: 100vw;
        width: 100%;
        margin: 0 auto;
        min-width: 0;
      }
      .contact-info-block {
        align-items: flex-start;
        padding: 0 12px;
      }
      .contact-info-inner {
        align-items: flex-start;
        max-width: 100vw;
        margin-top: 0;
      }
      .contact-form-card {
        padding: 16px 2vw 16px 2vw;
        min-width: 0;
      }
      .contact-social-row {
        justify-content: flex-start;
      }
      .established {
        padding-left: 0;
      }
    }
    @media (max-width: 480px) {
      .contact-info-block h2,
      .contact-form-card h3 {
        font-size: 1.3rem;
      }
      .contact-info-block {
        font-size: 1rem;
      }
      .contact-form-card {
        padding: 10px 1vw 10px 1vw;
      }
      .contact-social-icon {
        width: 38px;
        height: 38px;
        font-size: 1.2rem;
      }
      .form-group label, .form-group input, .form-group textarea, .form-group input::placeholder, .form-group textarea::placeholder {
        font-size: 1rem;
      }
      .contact-form button {
        font-size: 1rem;
        width: 100%;
      }
    }
    .map-link {
      display: inline-flex;
      align-items: center;
      margin-left: 8px;
      color: var(--white);
      text-decoration: none;
      transition: transform 0.2s, color 0.2s;
    }
    
    .map-link i {
      font-size: 1.2em;
    }
    
    .map-link:hover {
      color: #ffe5b4;
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <!-- ===========================
       Navbar Section
  ============================ -->
  <header class="navbar">
    <div class="logo">
      <img src="../assets/logo1.png" alt="Shree Sainath Packaging Logo" />
    </div>
    <div class="hamburger">
      <div class="hamburger-line"></div>
      <div class="hamburger-line"></div>
      <div class="hamburger-line"></div>
    </div>
    <nav class="nav-links">
      <a href="../index.html">Home</a>
      <a href="../aboutus/index.html">About</a>
      <a href="../products/index.html">Products</a>
      <a href="index.html">Contact</a>
    </nav>
  </header>

  <main>
    <div class="contact-main-wrapper">
      <!-- =========================
           LEFT: CONTACT INFO BLOCK
      ============================ -->
      <section class="contact-info-block" aria-labelledby="contact-heading">
        <div class="contact-info-inner">
          <h2 id="contact-heading">Contact</h2>
          <div class="contact-info-group">
            <div class="contact-info-label">
              <i class="bi bi-telephone-fill"></i>
              Phone:
            </div>
            <div class="contact-info-value">+91 9826071684</div>
          </div>
          <div class="contact-info-group">
            <div class="contact-info-label">
              <i class="bi bi-envelope-fill"></i>
              E-Mail:
            </div>
            <div class="contact-info-value">
              <a href="mailto:shreesainathpackaging722@gmail.com" target="_blank">shreesainathpackaging722@gmail.com</a>
            </div>
          </div>
          <div class="contact-info-group">
            <div class="contact-info-label">
              <i class="bi bi-geo-alt-fill"></i>
              Address:
            </div>
            <div class="contact-info-value">
              XYZ street, Indore
              <a href="https://maps.app.goo.gl/m6TEtg5uBc5pSBem9" target="_blank" class="map-link" aria-label="View location on Google Maps">
                <i class="bi bi-pin-map-fill"></i>
              </a>
            </div>
          </div>
          <div class="contact-social-row">
            <!-- WhatsApp Bootstrap Icon -->
            <a class="contact-social-icon" href="https://wa.link/xe7urx" target="_blank" rel="noopener" aria-label="WhatsApp">
              <i class="bi bi-whatsapp"></i>
            </a>
            <!-- Instagram Bootstrap Icon -->
            <a class="contact-social-icon" href="https://www.instagram.com/shreesainathpackeging/?igsh=NnI3cXM3aWkyZ2Qy" target="_blank" rel="noopener" aria-label="Instagram">
              <i class="bi bi-instagram"></i>
            </a>
          </div>
          <div class="established">Established in 2007</div>
          <a href="../assets/company brochure ss packaging.docx" download class="brochure-link">Company Brochure</a>
        </div>
      </section>
      <!-- =========================
           RIGHT: CONTACT FORM
      ============================ -->
      <section class="contact-form-card" aria-labelledby="form-heading">
        <h3 id="form-heading">Send us a message and <br> we'll get back to you shortly.</h3>
        <form class="contact-form" id="contactForm" autocomplete="off" novalidate>
          <div class="form-group">
            <label for="name">Name<span style="color: #d00;">*</span></label>
            <input type="text" id="name" name="name" placeholder="e.g., John Doe" required>
          </div>
          <div class="form-group">
            <label for="email">Email<span style="color: #d00;">*</span></label>
            <input type="email" id="email" name="email" placeholder="e.g., email@example.com" required>
          </div>
          <div class="form-group">
            <label for="phone">Phone Number<span style="color: #d00;">*</span></label>
            <input type="tel" id="phone" name="phone" placeholder="e.g., +91 992XXXXXXX" required pattern="[+0-9 ]{10,20}">
          </div>
          <div class="form-group">
            <label for="message">Your Message<span style="color: #d00;">*</span></label>
            <textarea id="message" name="message" placeholder="Enter text here" required></textarea>
          </div>
          <button type="submit" id="sendBtn">Send</button>
        </form>
      </section>
    </div>
  </main>

  <script>
    // Hamburger menu functionality
    const hamburger = document.querySelector('.hamburger');
    const navLinks = document.querySelector('.nav-links');

    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      navLinks.classList.toggle('active');
    });

    // Close menu when clicking outside
    document.addEventListener('click', (e) => {
      if (!hamburger.contains(e.target) && !navLinks.contains(e.target)) {
        hamburger.classList.remove('active');
        navLinks.classList.remove('active');
      }
    });

    // Fade-in for contact form card
    window.addEventListener('DOMContentLoaded', function() {
      document.querySelector('.contact-form-card').style.opacity = '1';
    });
    // Contact form validation and interaction
    const form = document.getElementById('contactForm');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      console.log('Form submitted');
      
      // Simple validation
      let valid = true;
      form.querySelectorAll('input, textarea').forEach(input => {
        if (!input.value.trim()) {
          input.style.boxShadow = '0 0 0 2px #d00';
          valid = false;
          console.log('Invalid field:', input.id);
        } else {
          input.style.boxShadow = '';
        }
      });
      if (!valid) {
        console.log('Form validation failed');
        return;
      }

      // Get form data
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const message = document.getElementById('message').value;

      console.log('Form data:', { name, email, phone, message });

      // Create email subject and body
      const subject = `New Contact Form Submission from ${name}`;
      const body = `Dear Shree Sainath Packaging Team,

A new contact form submission has been received:

Name: ${name}
Email: ${email}
Phone: ${phone}

Message:
${message}

Best regards,
${name}`;

      console.log('Email subject:', subject);
      console.log('Email body:', body);

      // Create and open mailto link
      const mailtoLink = `mailto:shreesainathpackaging722@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      console.log('Mailto link:', mailtoLink);

      try {
        window.open(mailtoLink, '_blank');
        console.log('Mailto link opened successfully in new tab');
      } catch (error) {
        console.error('Error opening mailto link:', error);
      }

      // Reset form
      form.reset();
      console.log('Form reset');
    });
    // Remove error highlight on input
    form.querySelectorAll('input, textarea').forEach(input => {
      input.addEventListener('input', function() {
        input.style.boxShadow = '';
      });
    });
  </script>
</body>
</html>
